overlay: 1.0.0
info:
  title: API Evangelist enhancements for Allium API
  version: 1.0.0
extends: openapi/allium-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: allium
    x-apievangelist-category: blockchain-data
    x-apievangelist-auth: X-API-KEY header (APIKeyBearer)
    x-apievangelist-mcp: https://mcp.allium.so
    x-apievangelist-docs: https://docs.allium.so/
- target: $.servers[0]
  update:
    description: Allium Realtime API production host
