aid: allium
name: Allium
description: 'Allium is an enterprise blockchain data platform that transforms raw on-chain
  data from 150+ blockchains into verified, decision-grade intelligence for institutional
  finance. It indexes and decodes activity across 10,000+ protocols and exposes it through
  Realtime REST APIs (sub-second wallet balances, holdings, PnL, DeFi positions, NFTs, DEX
  trades and Hyperliquid data), Datastreams (Kafka/Pub-Sub/SNS/websocket event feeds),
  Beam custom pipelines, the Explorer/Datashares historical layer, and Allium Terminal for
  research. It also ships an AI layer: a hosted MCP server, packaged Agent Skills, and
  x402 machine-payment endpoints. Customers include Visa, Grayscale, Phantom, MetaMask,
  MoonPay and the Federal Reserve. Backed by Amplify Partners, Kleiner Perkins and Theory
  Ventures.'
